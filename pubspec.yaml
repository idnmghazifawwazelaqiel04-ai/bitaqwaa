name: bitaqwa
description: 'Aplikasi Islami Bitaqwa - Tugas Kelas 9'
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_masked_text2: ^0.9.1
  intl: ^0.18.1
  geolocator: ^14.0.3
  chewie: ^1.8.1
  youtube_player_flutter: ^10.0.1
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: PoppinsBold
      fonts:
        - asset: assets/fonts/poppins_bold.ttf
    - family: PoppinsItalic
      fonts:
        - asset: assets/fonts/poppins_italic.ttf
    - family: PoppinsLight
      fonts:
        - asset: assets/fonts/poppins_light.ttf
    - family: PoppinsMedium
      fonts:
        - asset: assets/fonts/poppins_medium.ttf
    - family: PoppinsRegular
      fonts:
        - asset: assets/fonts/poppins_regular.ttf
    - family: PoppinsThin
      fonts:
        - asset: assets/fonts/poppins_thin.ttf
    - family: PoppinsSemiBold
      fonts:
        - asset: assets/fonts/poppins_semi_bold.ttf
